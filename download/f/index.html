<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Shared PDF · Smart School Tool</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0e16;
      --bg-glow: #141a2b;
      --card: rgba(24, 29, 44, 0.78);
      --text: #e8ebf3;
      --muted: #98a1b7;
      --accent: #4f7dff;
      --accent-hover: #6b91ff;
      --border: rgba(255, 255, 255, 0.09);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(ellipse at top, var(--bg-glow), var(--bg) 70%) fixed;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    main { position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 2rem 16px; }
    .card {
      background: var(--card);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .file-icon { width: 56px; height: 56px; fill: none; stroke: #22d3ee; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    h1 { margin: 0.75rem 0 0.25rem; font-size: 1.3rem; overflow-wrap: anywhere; }
    p { margin: 0; color: var(--muted); }
    a.button {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.7rem 1.4rem;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    a.button:hover { background: var(--accent-hover); }
    .from { margin-top: 1.5rem; font-size: 0.85rem; }
    .from a { color: var(--muted); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <svg class="file-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M12 5h17l9 9v29H12z"/>
        <path d="M29 5v9h9M24 21v15M18 30l6 6 6-6"/>
      </svg>
      <h1 id="title">Getting the PDF…</h1>
      <p id="status"></p>
      <a class="button" id="download" href="#" hidden>Download PDF</a>
      <p class="from">Shared with <a href="../">Smart School Tool</a></p>
    </div>
  </main>

  <script src="../snow.js"></script>
  <script src="../config.js"></script>
  <script>
    // Short link to a PDF a student shared: .../f/?<code>. Looks up the download link and starts it.
    (async function () {
      const $ = (id) => document.getElementById(id);
      const code = location.search.slice(1).split("&")[0];
      const gone = (text) => {
        $("title").textContent = "This PDF isn't shared any more";
        $("status").textContent = text || "The student stopped sharing it, or the link is wrong. Ask them to send it again.";
      };
      if (!/^[A-Za-z0-9]{8,16}$/.test(code)) return gone("This link is incomplete. Check that you copied all of it.");
      try {
        const config = window.APP_CONFIG;
        const response = await fetch(`${config.supabaseUrl}/rest/v1/rpc/open_share_link`, {
          method: "POST",
          headers: { apikey: config.supabaseKey, "Content-Type": "application/json" },
          body: JSON.stringify({ link_code: code }),
        });
        const rows = response.ok ? await response.json() : [];
        if (!rows.length) return gone();
        const { name, url } = rows[0];
        document.title = `${name} · Smart School Tool`;
        $("title").textContent = name;
        $("status").textContent = "Your download should start by itself.";
        $("download").href = url;
        $("download").hidden = false;
        location.replace(url);
      } catch {
        $("title").textContent = "Couldn't get the PDF";
        $("status").textContent = "Check your internet connection and open the link again.";
      }
    })();
  </script>
</body>
</html>
