# macOS build settings. The app code itself lives in ../src and is shared with the Windows build.
appId: com.isaac.smartschooltool
productName: Smart School Tool
directories:
  output: mac/dist
files:
  - src/**/*
mac:
  icon: src/icon.png
  category: public.app-category.education
  # Universal = one download that runs on both Apple Silicon and Intel Macs.
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  artifactName: Smart-School-Tool-Mac.${ext}
  # Ad-hoc signature (no paid Apple Developer account). Required for the app to open on Apple Silicon.
  identity: "-"
  hardenedRuntime: false
