<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Reset Password</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0e16;
      --bg-glow: #141a2b;
      --card: rgba(24, 29, 44, 0.78);
      --field: rgba(10, 13, 21, 0.7);
      --text: #e8ebf3;
      --muted: #98a1b7;
      --accent: #4f7dff;
      --accent-hover: #6b91ff;
      --border: rgba(255, 255, 255, 0.09);
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(ellipse at top, var(--bg-glow), var(--bg) 70%) fixed;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    main { position: relative; z-index: 1; max-width: 420px; margin: 0 auto; padding: 3rem 16px; }
    h1 { text-align: center; margin: 0 0 1.25rem; font-size: 1.6rem; }
    .card {
      background: var(--card);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
    }
    form { display: grid; gap: 0.75rem; }
    label { display: grid; gap: 0.3rem; }
    label span { font-size: 0.9rem; color: var(--muted); }
    input {
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--field);
      color: var(--text);
    }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button {
      padding: 0.65rem 1rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: default; }
    p { margin: 0; }
    .message.error { color: var(--danger); }
    .message.success { color: #5fd38d; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Reset your password</h1>
    <div class="card">
      <p id="status">Checking your reset link…</p>
      <form id="reset-form" hidden>
        <label>
          <span>New password</span>
          <input name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
        </label>
        <label>
          <span>Type it again</span>
          <input name="confirm" type="password" autocomplete="new-password" required>
        </label>
        <p class="message" id="message" role="status"></p>
        <button type="submit">Save new password</button>
      </form>
    </div>
  </main>

  <!-- snow.js, config.js and supabase.js are copied in from the app when the site is deployed. -->
  <script src="snow.js"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script>
    const status = document.getElementById("status");
    const form = document.getElementById("reset-form");
    const message = document.getElementById("message");
    const config = window.APP_CONFIG || {};

    function show(text, kind) {
      message.textContent = text;
      message.className = "message " + (kind || "");
    }

    const hash = new URLSearchParams(location.hash.slice(1));
    if (hash.get("error_description")) {
      status.textContent = hash.get("error_description").replace(/\+/g, " ") +
        ". Ask for a new reset link from the app (Log in → Forgot password?).";
    } else if (!config.supabaseUrl || !window.supabase) {
      status.textContent = "Accounts aren't set up yet.";
    } else {
      const db = window.supabase.createClient(config.supabaseUrl, config.supabaseKey, {
        auth: { detectSessionInUrl: true, persistSession: false },
      });

      let ready = false;
      db.auth.onAuthStateChange((event, session) => {
        if (session && !ready) {
          ready = true;
          status.textContent = "Choose a new password for " + session.user.email + ".";
          form.hidden = false;
          form.elements.password.focus();
        }
      });
      setTimeout(() => {
        if (!ready) status.textContent = "This reset link is invalid or has expired. Ask for a new one from the app (Log in → Forgot password?).";
      }, 4000);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = form.elements.password.value;
        if (password.length < 8) return show("Your password needs at least 8 characters.", "error");
        if (password !== form.elements.confirm.value) return show("The two passwords don't match.", "error");
        const button = form.querySelector("button");
        button.disabled = true;
        const { error } = await db.auth.updateUser({ password });
        button.disabled = false;
        if (error) return show(error.message, "error");
        await db.auth.signOut();
        form.hidden = true;
        status.textContent = "Your password has been changed. Go back to Smart School Tool and log in with your new password.";
        status.className = "message success";
      });
    }
  </script>
</body>
</html>
