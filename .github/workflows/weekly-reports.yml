name: Weekly study reports

# Every Sunday, email each student's logged study time to their teachers.
# Needs repository secrets SUPABASE_SERVICE_ROLE_KEY, GMAIL_USER and GMAIL_APP_PASSWORD.
on:
  schedule:
    - cron: "0 17 * * 0" # Sundays 17:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build the emails but don't send them"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: weekly-reports
  cancel-in-progress: false

jobs:
  send:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Send reports
        run: node scripts/send-weekly-reports.mjs
        env:
          SUPABASE_URL: https://kjnvkgzqwsgjexcysjjj.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
