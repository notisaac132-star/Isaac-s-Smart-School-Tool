# macOS build settings. The app code itself lives in ../src and is shared with the Windows build.
appId: com.isaac.smartschooltool
productName: Smart School Tool
directories:
  output: mac/dist
files:
  - src/**/*
mac:
  icon: src/icon.png
  category: public.app-category.education
  extendInfo:
    # Shown when the app first moves the email window next to itself (Quick submit).
    NSAppleEventsUsageDescription: Smart School Tool puts your email window next to the app so you can drag your PDF into it.
  # Universal = one download that runs on both Apple Silicon and Intel Macs.
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  artifactName: Smart-School-Tool-Mac.${ext}
  # Ad-hoc signature (no paid Apple Developer account). Required for the app to open on Apple Silicon.
  identity: "-"
  hardenedRuntime: false
# The .dmg window: night-sky background (mac/dmg, made by installer/make-art.py; background@2x.png is the
# Retina copy), with the app and the Applications folder on the coloured card.
dmg:
  title: Smart School Tool
  background: mac/dmg/background.png
  iconSize: 96
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 196
      type: file
    - x: 390
      y: 196
      type: link
      path: /Applications
# Where installed apps look for updates (files are uploaded by the GitHub Actions release job).
publish:
  provider: github
  owner: notisaac132-star
  repo: Isaac-s-Smart-School-Tool
