<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Smart School Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Landing page -->
  <main class="view" id="home">
    <div class="hero">
      <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
        <rect x="16" y="16" width="480" height="480" rx="110" fill="#3b6cf6"/>
        <path d="M256 130 L440 215 L256 300 L72 215 Z" fill="#fff"/>
        <path d="M150 255 V340 C150 380 362 380 362 340 V255 L256 305 Z" fill="#fff"/>
        <path d="M420 225 V330" stroke="#ffd34d" stroke-width="16" stroke-linecap="round"/>
        <circle cx="420" cy="342" r="18" fill="#ffd34d"/>
      </svg>
      <p class="greeting" id="greeting">Welcome</p>
      <h1>Isaac's Smart School Tool</h1>
      <p class="today" id="today"></p>
    </div>

    <div class="tiles">
      <a class="tile" href="#contacts">
        <svg class="tile-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="tile-title">Teachers &amp; Tutors</span>
        <span class="tile-sub" id="contacts-summary">Add your teachers' and tutors' emails</span>
      </a>
      <div class="tile tile-soon" aria-disabled="true">
        <svg class="tile-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="tile-title">More coming soon</span>
        <span class="tile-sub">New tools will show up here</span>
      </div>
    </div>
  </main>

  <!-- Teachers & tutors -->
  <main class="view" id="contacts" hidden>
    <div class="view-header">
      <a class="back" href="#home">← Home</a>
      <h1>Teachers &amp; Tutors</h1>
    </div>

    <section class="card" id="teachers-section">
      <h2>Teachers</h2>
      <form class="contact-form" data-kind="teachers">
        <input name="name" type="text" placeholder="Name (e.g. Ms. Smith)" required>
        <input name="subject" type="text" placeholder="Subject (optional)">
        <input name="email" type="email" placeholder="teacher@school.edu" required>
        <button type="submit">Add teacher</button>
      </form>
      <ul class="contact-list" id="teachers-list"></ul>
    </section>

    <section class="card" id="tutors-section">
      <h2>Tutors</h2>
      <form class="contact-form" data-kind="tutors">
        <input name="name" type="text" placeholder="Name (e.g. Alex)" required>
        <input name="subject" type="text" placeholder="Subject (optional)">
        <input name="email" type="email" placeholder="tutor@example.com" required>
        <button type="submit">Add tutor</button>
      </form>
      <ul class="contact-list" id="tutors-list"></ul>
    </section>
  </main>

  <script src="snow.js"></script>
  <script src="app.js"></script>
</body>
</html>
